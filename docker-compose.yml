services:
  redis:
    image: redis:7-alpine@sha256:119c9edaa6389b4c141f7faa74dae3f3b91ac50c3376d39596044ef07c2592e2
    container_name: event-platform-redis
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    command: >
      sh -c "exec redis-server
      --requirepass $$(cat /run/secrets/redis_password)
      --protected-mode yes"
    secrets:
      - redis_password
    ports:
      - "127.0.0.1:6379:6379"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./docker-data/redis:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a \"$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  clamav:
    image: clamav/clamav:stable
    container_name: event-platform-clamav
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-defs:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  clamav-defs:

secrets:
  redis_password:
    file: ./docker-secrets/redis_password
