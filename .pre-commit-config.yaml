repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        # Run alongside gitleaks: gitleaks catches known-pattern leaks
        # (AWS keys, JWTs, etc.), detect-secrets catches high-entropy
        # strings that don't match a specific pattern. Overlap is fine.
