name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-scan:
    needs: [gitleaks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Scan for vulnerable NuGet packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt
          if grep -q "has the following vulnerable packages" vuln-report.txt; then
            echo "::error::Vulnerable NuGet packages detected"
            cat vuln-report.txt
            exit 1
          fi

  integration-tests:
    needs: [build-and-scan]
    runs-on: ubuntu-latest
    # Testcontainers needs Docker — ubuntu-latest runners include Docker Engine
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build integration tests
        run: dotnet build tests/IntegrationTests/IntegrationTests.csproj --no-restore --configuration Release

      - name: Run integration tests
        run: dotnet test tests/IntegrationTests/IntegrationTests.csproj --no-build --configuration Release --logger "console;verbosity=normal"
        timeout-minutes: 10
        env:
          # Testcontainers connects to Docker daemon via socket (available on ubuntu-latest)
          DOCKER_HOST: unix:///var/run/docker.sock
          # Placeholder values — DatabaseFixture overrides these with container URLs at runtime
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "integration-test-jwt-secret-must-be-32-chars!!"
          STRIPE_SECRET_KEY: "sk_test_integration_placeholder"

