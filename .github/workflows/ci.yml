name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  preflight-branch-protection:
    # Verifies that main branch protection is still configured with required
    # status checks. Catches the failure mode where a well-meaning admin turns
    # protection off and CI silently keeps passing. Skipped on private repos
    # without GitHub Pro (the Branch Protection API 403s with a plan message);
    # once the repo goes public this step starts enforcing automatically.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check required status checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if response=$(gh api "repos/${{ github.repository }}/branches/main/protection" 2>/tmp/err); then
            required=$(echo "$response" | jq -r '.required_status_checks.contexts // empty')
            if [ -z "$required" ]; then
              echo "::error::main branch protection is missing required_status_checks"
              echo "$response" | jq .
              exit 1
            fi
            echo "Branch protection OK — required checks: $required"
            exit 0
          fi
          err=$(cat /tmp/err)
          if echo "$err" | grep -q "HTTP 404"; then
            echo "::error::main branch has no protection rule"
            echo "$err"
            exit 1
          fi
          # Any other error (403 plan-limit or token-scope, 5xx, DNS, etc.) is
          # treated as deferred — we cannot assert protection from this runner.
          echo "::warning::Branch protection API not accessible — preflight deferred"
          echo "$err"
          exit 0

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-scan:
    needs: [gitleaks, preflight-branch-protection]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.x'

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test (unit — Api.Tests only)
        # IntegrationTests runs in its own job with Docker/Testcontainers.
        # Keep this step scoped to the fast unit suite so build-and-scan stays hermetic.
        run: dotnet test tests/Api.Tests/Api.Tests.csproj --no-build --configuration Release

      - name: Scan for vulnerable NuGet packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt
          if grep -q "has the following vulnerable packages" vuln-report.txt; then
            echo "::error::Vulnerable NuGet packages detected"
            cat vuln-report.txt
            exit 1
          fi

  integration-tests:
    needs: [build-and-scan]
    runs-on: ubuntu-latest
    # Testcontainers needs Docker — ubuntu-latest runners include Docker Engine
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.x'

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build integration tests
        run: dotnet build tests/IntegrationTests/IntegrationTests.csproj --no-restore --configuration Release

      - name: Checkout code829-db
        # Schema repo went private — use a fine-grained PAT (DB_REPO_TOKEN, contents:read)
        # via actions/checkout instead of an unauthenticated git clone.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Sidppatel/code829-db
          ref: main
          token: ${{ secrets.DB_REPO_TOKEN }}
          path: code829-db

      - name: Pre-build code829-db MigrationRunner
        # Single source of truth: integration tests apply the schema using the
        # same MigrationRunner that runs against prod. Pre-publishing here keeps
        # each Testcontainers Postgres bootstrap fast (no clone/build per test run).
        run: |
          set -euo pipefail
          dotnet publish code829-db/src/MigrationRunner -c Release -o /tmp/code829-db-migrate -p:UseAppHost=false
          test -f /tmp/code829-db-migrate/MigrationRunner.dll
          echo "MIGRATION_RUNNER_DLL=/tmp/code829-db-migrate/MigrationRunner.dll" >> "$GITHUB_ENV"

      - name: Generate ephemeral CI secrets
        # Secrets only need to exist for this job. Literal values in CI yaml look
        # like real secrets to automated scrapers, so we synthesize them here
        # instead. Test-only Stripe key prefix keeps Stripe SDK happy while
        # remaining obviously non-functional.
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "STRIPE_SECRET_KEY=sk_test_$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - name: Run integration tests (with coverage)
        run: |
          dotnet test tests/IntegrationTests/IntegrationTests.csproj \
            --no-build --configuration Release \
            --logger "console;verbosity=normal" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura \
               DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include="[api]*" \
               DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Exclude="[api]Api.Data.Migrations.*"
        timeout-minutes: 10
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          REDIS_URL: "redis://localhost:6379"

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:"coverage/**/coverage.cobertura.xml" \
            -targetdir:coverage/report \
            -reporttypes:"Html;Cobertura;TextSummary;MarkdownSummaryGithub"

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage/report

      - name: Post coverage to PR summary
        if: always()
        run: |
          if [ -f coverage/report/SummaryGithub.md ]; then
            cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce coverage threshold (api project)
        # Ratcheting threshold — see docs/adr/0010-coverage-ratchet.md for the
        # schedule. Raised from 15% to 19% in security session S5 (2026-04-24);
        # CI measured 19.4% actual on master, so the floor sits just under the
        # current value to give the suite a small margin for variance. BE #7
        # target is 60%; bump +5pt each month until we cross that number.
        run: |
          if [ ! -f coverage/report/Summary.txt ]; then
            echo "::error::Coverage summary missing"
            exit 1
          fi
          LINE_PCT=$(grep -E "^\s*Line coverage:" coverage/report/Summary.txt | head -1 | grep -oE "[0-9.]+%" | head -1 | tr -d '%')
          echo "Line coverage: $LINE_PCT%"
          awk -v pct="$LINE_PCT" 'BEGIN { if (pct+0 < 19.0) { print "::error::Coverage " pct "% is below 19% threshold"; exit 1 } else { print "Coverage OK: " pct "%" } }'

  arch-exception-count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Count ARCH-EXCEPTION markers
        run: |
          COUNT=$(grep -rn "ARCH-EXCEPTION\|AllowDirectDbAccess" api/ contracts/ | wc -l)
          BASELINE=$(grep -oE '[0-9]+' docs/arch-exception-inventory.md | head -1)
          echo "Current: $COUNT  Baseline: $BASELINE"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::ARCH-EXCEPTION count rose ($COUNT > $BASELINE). Fix the violation, or bump the baseline in docs/arch-exception-inventory.md with a category-(c) justification row."
            grep -rn "ARCH-EXCEPTION\|AllowDirectDbAccess" api/ contracts/ || true
            exit 1
          fi

