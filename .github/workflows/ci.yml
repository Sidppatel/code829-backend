name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-scan:
    needs: [gitleaks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test (unit — Api.Tests only)
        # IntegrationTests runs in its own job with Docker/Testcontainers.
        # Keep this step scoped to the fast unit suite so build-and-scan stays hermetic.
        run: dotnet test tests/Api.Tests/Api.Tests.csproj --no-build --configuration Release

      - name: Scan for vulnerable NuGet packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt
          if grep -q "has the following vulnerable packages" vuln-report.txt; then
            echo "::error::Vulnerable NuGet packages detected"
            cat vuln-report.txt
            exit 1
          fi

  integration-tests:
    needs: [build-and-scan]
    runs-on: ubuntu-latest
    # Testcontainers needs Docker — ubuntu-latest runners include Docker Engine
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build integration tests
        run: dotnet build tests/IntegrationTests/IntegrationTests.csproj --no-restore --configuration Release

      - name: Run integration tests (with coverage)
        run: |
          dotnet test tests/IntegrationTests/IntegrationTests.csproj \
            --no-build --configuration Release \
            --logger "console;verbosity=normal" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura \
               DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include="[api]*" \
               DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Exclude="[api]Api.Migrations.*,[api]Api.Seeding.*"
        timeout-minutes: 10
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "integration-test-jwt-secret-must-be-32-chars!!"
          STRIPE_SECRET_KEY: "sk_test_integration_placeholder"

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:"coverage/**/coverage.cobertura.xml" \
            -targetdir:coverage/report \
            -reporttypes:"Html;Cobertura;TextSummary;MarkdownSummaryGithub"

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/report

      - name: Post coverage to PR summary
        if: always()
        run: |
          if [ -f coverage/report/SummaryGithub.md ]; then
            cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce coverage threshold (api project)
        # Threshold starts at 15% — baseline after S2's smoke tests landed.
        # BE #7 target is 60%. Raise this gate as controller happy-path tests
        # (currently smoke-only for 19 of 26 controllers) land in follow-up work.
        run: |
          if [ ! -f coverage/report/Summary.txt ]; then
            echo "::error::Coverage summary missing"
            exit 1
          fi
          LINE_PCT=$(grep -E "^\s*Line coverage:" coverage/report/Summary.txt | head -1 | grep -oE "[0-9.]+%" | head -1 | tr -d '%')
          echo "Line coverage: $LINE_PCT%"
          awk -v pct="$LINE_PCT" 'BEGIN { if (pct+0 < 15.0) { print "::error::Coverage " pct "% is below 15% threshold"; exit 1 } else { print "Coverage OK: " pct "%" } }'

