name: Security

# Scheduled weekly sweep + on-PR spot-check for security regressions. Complements
# the inline gitleaks + vulnerable-package scan in `ci.yml`. The schedule gate
# catches newly-disclosed CVEs in a transitive NuGet that land after the last
# PR merge (no CI would otherwise re-run on master until the next push).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 05:32 UTC — offset so we don't stampede with CIDR refresh (06:00)
    - cron: '32 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  nuget-audit:
    name: NuGet vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Restore (locked mode)
        run: dotnet restore --locked-mode
      - name: List vulnerable packages
        run: |
          set -euo pipefail
          out=$(dotnet list package --vulnerable --include-transitive 2>&1)
          echo "$out"
          if echo "$out" | grep -qiE 'has the following vulnerable'; then
            echo "::error::Vulnerable NuGet packages detected"
            exit 1
          fi
