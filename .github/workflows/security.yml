name: Security

# Scheduled weekly sweep + on-PR spot-check for security regressions. Complements
# the inline gitleaks + vulnerable-package scan in `ci.yml`. The schedule gate
# catches newly-disclosed CVEs in a transitive NuGet that land after the last
# PR merge (no CI would otherwise re-run on master until the next push).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 05:32 UTC — offset so we don't stampede with CIDR refresh (06:00)
    - cron: '32 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan for secrets
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C /tmp
          /tmp/gitleaks detect --source=. --redact --verbose --exit-code=1

  nuget-audit:
    name: NuGet vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore (locked mode)
        run: dotnet restore --locked-mode
      - name: List vulnerable packages
        run: |
          set -euo pipefail
          out=$(dotnet list package --vulnerable --include-transitive 2>&1)
          echo "$out"
          if echo "$out" | grep -qiE 'has the following vulnerable'; then
            echo "::error::Vulnerable NuGet packages detected"
            exit 1
          fi
