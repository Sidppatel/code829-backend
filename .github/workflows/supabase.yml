name: Supabase CI/CD

on:
  push:
    branches:
      - master
    paths:
      - 'db/Migrations/**'
  pull_request:
    branches:
      - master
    paths:
      - 'db/Migrations/**'
  workflow_dispatch:

jobs:
  supabase-migration:
    name: Run Supabase Migrations
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Disable IPv6 to force IPv4 DNS resolution
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.lo.disable_ipv6=1
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
          # Verify: DNS should only return A records now
          getent ahostsv4 db.liumjvxetqcvdmiakmpw.supabase.co || true

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run EF Core migrations
        run: dotnet ef database update --project db/db.csproj --startup-project api/api.csproj --no-build --configuration Release
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_MODE: Require
          REDIS_URL: redis://localhost:6379
          ASPNETCORE_ENVIRONMENT: Production
