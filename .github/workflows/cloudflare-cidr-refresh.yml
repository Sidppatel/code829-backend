name: Cloudflare CIDR refresh

# Weekly check for Cloudflare IP changes. Diffs the published IP lists against
# the TRUSTED_PROXIES value in render.yaml and opens a PR if they differ.
# Manual trigger via workflow_dispatch is supported for ad-hoc runs.

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Fetch Cloudflare IPv4 + IPv6
        id: fetch
        run: |
          set -euo pipefail
          curl -fsSL https://www.cloudflare.com/ips-v4/ -o ips-v4.txt
          curl -fsSL https://www.cloudflare.com/ips-v6/ -o ips-v6.txt

      - name: Validate CIDR lines
        # Reject anything that doesn't match a strict IPv4 or IPv6 CIDR.
        # An attacker controlling the upstream response (or an MITM between the
        # runner and cloudflare.com) could otherwise inject arbitrary bytes into
        # render.yaml via this automated PR.
        id: validate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ipaddress
          import re
          import sys

          IPV4_RE = re.compile(r"^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$")
          IPV6_RE = re.compile(r"^[0-9a-fA-F:]+/\d{1,3}$")

          def load(path, validator, regex):
              with open(path, encoding="utf-8") as f:
                  raw = f.read()
              lines = [ln.strip() for ln in raw.splitlines() if ln.strip()]
              clean = []
              for ln in lines:
                  if not regex.match(ln):
                      print(f"::error::Invalid CIDR line in {path}: {ln!r}", file=sys.stderr)
                      sys.exit(1)
                  try:
                      validator(ln, strict=False)
                  except ValueError as ex:
                      print(f"::error::Unparseable CIDR in {path}: {ln!r} ({ex})", file=sys.stderr)
                      sys.exit(1)
                  clean.append(ln)
              if not clean:
                  print(f"::error::No CIDR entries parsed from {path}", file=sys.stderr)
                  sys.exit(1)
              return clean

          v4 = load("ips-v4.txt", ipaddress.IPv4Network, IPV4_RE)
          v6 = load("ips-v6.txt", ipaddress.IPv6Network, IPV6_RE)

          with open("cidrs.txt", "w", encoding="utf-8") as f:
              f.write(",".join(v4 + v6))
          PY
          echo "ips=$(cat cidrs.txt)" >> "$GITHUB_OUTPUT"

      - name: Diff render.yaml TRUSTED_PROXIES
        id: diff
        env:
          NEW_CIDRS: ${{ steps.validate.outputs.ips }}
        run: |
          set -euo pipefail
          current=$(awk '/- key: TRUSTED_PROXIES/{flag=1; next} flag && /value:/{sub(/^[[:space:]]*value:[[:space:]]*/, ""); print; exit}' render.yaml)
          if [ "$current" = "$NEW_CIDRS" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            python3 - <<'PY'
          import os, re, pathlib
          p = pathlib.Path("render.yaml")
          text = p.read_text()
          new = os.environ["NEW_CIDRS"]
          text = re.sub(
              r"(- key: TRUSTED_PROXIES\n[ \t]*value:[ \t]*).*",
              lambda m: m.group(1) + new,
              text,
              count=1,
          )
          p.write_text(text)
          PY
          fi

      - name: Open PR if changed
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          branch: chore/cloudflare-cidr-refresh
          commit-message: 'chore: refresh Cloudflare TRUSTED_PROXIES CIDRs'
          title: 'chore: refresh Cloudflare TRUSTED_PROXIES CIDRs'
          body: |
            Automated weekly refresh from https://www.cloudflare.com/ips-v4 + ips-v6.
            Review the diff against render.yaml and merge if the change is expected.
          labels: automated, security
