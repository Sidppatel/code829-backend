name: Cloudflare CIDR refresh

# Weekly check for Cloudflare IP changes. Diffs the published IPv4 and IPv6
# lists against the TRUSTED_PROXIES and CLOUDFLARE_IPV6_CIDRS values in
# render.yaml and opens a PR if either differs. Both env vars are consumed by
# api/Middleware/CloudflareIpAllowlistMiddleware.cs and ForwardedHeadersConfig.
# Manual trigger via workflow_dispatch is supported for ad-hoc runs.

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Cloudflare IPv4 + IPv6
        run: |
          set -euo pipefail
          curl -fsSL https://www.cloudflare.com/ips-v4/ -o ips-v4.txt
          curl -fsSL https://www.cloudflare.com/ips-v6/ -o ips-v6.txt

      - name: Validate CIDR lines
        # Reject anything that doesn't match a strict IPv4 or IPv6 CIDR. Without
        # validation, an attacker controlling the upstream response (or an MITM
        # between the runner and cloudflare.com) could inject arbitrary bytes
        # into render.yaml via this automated PR.
        id: validate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ipaddress
          import re
          import sys

          IPV4_RE = re.compile(r"^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$")
          IPV6_RE = re.compile(r"^[0-9a-fA-F:]+/\d{1,3}$")

          def load(path, validator, regex):
              with open(path, encoding="utf-8") as f:
                  raw = f.read()
              lines = [ln.strip() for ln in raw.splitlines() if ln.strip()]
              clean = []
              for ln in lines:
                  if not regex.match(ln):
                      print(f"::error::Invalid CIDR line in {path}: {ln!r}", file=sys.stderr)
                      sys.exit(1)
                  try:
                      validator(ln, strict=False)
                  except ValueError as ex:
                      print(f"::error::Unparseable CIDR in {path}: {ln!r} ({ex})", file=sys.stderr)
                      sys.exit(1)
                  clean.append(ln)
              if not clean:
                  print(f"::error::No CIDR entries parsed from {path}", file=sys.stderr)
                  sys.exit(1)
              return clean

          v4 = load("ips-v4.txt", ipaddress.IPv4Network, IPV4_RE)
          v6 = load("ips-v6.txt", ipaddress.IPv6Network, IPV6_RE)

          with open("cidrs-v4.txt", "w", encoding="utf-8") as f:
              f.write(",".join(v4))
          with open("cidrs-v6.txt", "w", encoding="utf-8") as f:
              f.write(",".join(v6))
          PY
          {
            echo "ipv4=$(cat cidrs-v4.txt)"
            echo "ipv6=$(cat cidrs-v6.txt)"
          } >> "$GITHUB_OUTPUT"

      - name: Diff render.yaml env values
        id: diff
        env:
          NEW_V4: ${{ steps.validate.outputs.ipv4 }}
          NEW_V6: ${{ steps.validate.outputs.ipv6 }}
        run: |
          set -euo pipefail
          current_v4=$(awk '/- key: TRUSTED_PROXIES/{flag=1; next} flag && /value:/{sub(/^[[:space:]]*value:[[:space:]]*/, ""); print; exit}' render.yaml)
          current_v6=$(awk '/- key: CLOUDFLARE_IPV6_CIDRS/{flag=1; next} flag && /value:/{sub(/^[[:space:]]*value:[[:space:]]*/, ""); print; exit}' render.yaml)

          if [ "$current_v4" = "$NEW_V4" ] && [ "$current_v6" = "$NEW_V6" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            python3 - <<'PY'
          import os
          import pathlib
          import re

          new_v4 = os.environ["NEW_V4"]
          new_v6 = os.environ["NEW_V6"]
          path = pathlib.Path("render.yaml")
          text = path.read_text(encoding="utf-8")
          text = re.sub(
              r"(- key: TRUSTED_PROXIES\n[ \t]*value:[ \t]*).*",
              lambda m: m.group(1) + new_v4,
              text,
              count=1,
          )
          text = re.sub(
              r"(- key: CLOUDFLARE_IPV6_CIDRS\n[ \t]*value:[ \t]*).*",
              lambda m: m.group(1) + new_v6,
              text,
              count=1,
          )
          path.write_text(text, encoding="utf-8")
          PY
          fi

      - name: Open PR if changed
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/cloudflare-cidr-refresh
          commit-message: 'chore: refresh Cloudflare TRUSTED_PROXIES + CLOUDFLARE_IPV6_CIDRS'
          title: 'chore: refresh Cloudflare TRUSTED_PROXIES + CLOUDFLARE_IPV6_CIDRS'
          body: |
            Automated weekly refresh from https://www.cloudflare.com/ips-v4 + ips-v6.
            Review the diff against render.yaml and merge if the change is expected.
            Both env vars feed CloudflareIpAllowlistMiddleware.
          labels: automated, security
