name: Migrate prod DB

on:
  workflow_dispatch:

concurrency:
  group: migrate-prod
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Checkout code829-db
        # Schema repo went private — use DB_REPO_TOKEN (fine-grained PAT, contents:read)
        # via actions/checkout instead of an unauthenticated git clone.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Sidppatel/code829-db
          ref: main
          token: ${{ secrets.DB_REPO_TOKEN }}
          path: db

      - name: Run MigrationRunner against prod (session pooler)
        working-directory: db
        env:
          DB_HOST:     ${{ vars.DB_HOST }}
          DB_PORT:     ${{ vars.DB_PORT_SESSION }}
          DB_USER:     ${{ vars.DB_USER }}
          DB_NAME:     ${{ vars.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail
          PASS_ENC=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['DB_PASSWORD'],safe=''))")
          export MIGRATION_DATABASE_URL="postgresql://${DB_USER}:${PASS_ENC}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require"
          dotnet run --project src/MigrationRunner -c Release
