# Render Blueprint for code829-backend
# Docs: https://render.com/docs/blueprint-spec
#
# Usage:
#   1. In the Render dashboard, click "New" → "Blueprint" and point it at this repo.
#   2. Render auto-discovers this file and provisions the service on `master` pushes.
#   3. Fill in the env vars marked `sync: false` — those are secrets that never live
#      in this file. Non-secret defaults (ASPNETCORE_ENVIRONMENT, PORT) are set here.
#
# The frontend deploys independently via .github/workflows/deploy.yml in code829-frontend
# to Cloudflare Workers — it is NOT managed by this blueprint.

services:
  - type: web
    name: code829-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    branch: master
    autoDeploy: true
    healthCheckPath: /health/live
    envVars:
      # ─── Runtime (non-secret) ───────────────────────────────────
      # Set in the Render dashboard, NOT here. Use `Staging` until you have live
      # Stripe keys (sk_live_*) — Program.cs refuses to start in Production without
      # them. Flip to `Production` once live keys are wired up.
      - key: ASPNETCORE_ENVIRONMENT
        sync: false
      - key: PORT
        value: "10000"

      # ─── Required secrets ───────────────────────────────────────
      # Supabase transaction pooler URL (port 6543). Migrations run locally
      # against the session URL (5432). See DEPLOYMENT.md.
      - key: DATABASE_URL
        sync: false
      # Upstash Redis TLS URL (rediss://…:6380)
      - key: REDIS_URL
        sync: false
      # Generate via: openssl rand -hex 32
      - key: JWT_SECRET
        sync: false
      # Stripe is mandatory in every environment — startup fails without this.
      - key: STRIPE_SECRET_KEY
        sync: false

      # ─── Optional secrets / integrations ────────────────────────
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: CDN_BASE_URL
        sync: false

      # ─── Cloudflare / networking ────────────────────────────────
      # Public URL used in magic-link emails and seed data.
      - key: FRONTEND_URL
        value: https://code829.com
      # Allowed origins for CORS (API is called from all four frontends).
      - key: CORS_ORIGINS
        value: https://code829.com,https://admin.code829.com,https://developer.code829.com,https://staff.code829.com
      # Cloudflare IPv4 ranges — so ForwardedHeadersMiddleware trusts X-Forwarded-For
      # from the Workers in front of this service. Refresh from:
      # https://www.cloudflare.com/ips-v4
      - key: TRUSTED_PROXIES
        value: 173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22
